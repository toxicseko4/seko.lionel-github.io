name: Build 26Safari

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos and ldid
        run: |
          brew install ldid
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Install roothide's Theos fork
        continue-on-error: true
        run: git clone --recursive https://github.com/roothide/theos.git "$HOME/theos-roothide"

      - name: Build Rootless .deb
        run: |
          rm -rf .theos
          make package SCHEME=rootless FINALPACKAGE=1

      - name: Build Rootful .deb
        run: |
          rm -rf .theos
          make package SCHEME=rootful FINALPACKAGE=1

      - name: Build Roothide .deb
        continue-on-error: true
        run: |
          rm -rf .theos
          THEOS="$HOME/theos-roothide" make package SCHEME=roothide FINALPACKAGE=1

      - name: List the built packages
        if: always()
        run: ls -l packages || true

      - name: Upload all deb artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 26safari-debs
          path: packages/*.deb
