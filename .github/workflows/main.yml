name: Build 26Safari

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos and ldid
        run: |
          brew install ldid
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build rootless .deb
        run: make package FINALPACKAGE=1

      - name: Check the dylib is real
        run: |
          find .theos/obj -name "26safari.dylib" -exec ls -l {} \; -exec lipo -info {} \; -exec otool -L {} \;

      - uses: actions/upload-artifact@v4
        with:
          name: 26safari-deb
          path: packages/*.deb
